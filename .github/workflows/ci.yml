name: CI

# 56 ta test + Django check + JS check har push va PR'да ishlaydi.
# DEBUG=1 => SQLite, tashqi baza kerak emas.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baza migratsiyasi (check_js/check DB'ga murojaat qiladi)
        run: python manage.py migrate --noinput

      - name: JS sintaksis tekshiruvi (check_js)
        run: python manage.py check_js

      - name: Django tizim tekshiruvi (check)
        run: python manage.py check

      - name: Migratsiyalar to'liqmi (makemigrations --check)
        run: python manage.py makemigrations --check --dry-run

      - name: Testlar
        run: python manage.py test inventory --verbosity 2
