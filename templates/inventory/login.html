{% extends 'inventory/base.html' %}

{% block title %}Kirish — yurit{% endblock %}

{% block content %}
<div class="dash-page" style="min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
    <div style="width: 100%; max-width: 420px;">
        <div class="dash-hero" style="margin-bottom: 0;">
            <div class="dash-hero__glow"></div>
            <div class="dash-hero__inner" style="display: block; padding: 2.25rem 1.85rem 2rem; text-align: center;">
                <div style="margin-bottom: 1rem;">
                    <div style="width: 64px; height: 64px; margin: 0 auto;
                                display: inline-flex; align-items: center; justify-content: center;
                                background: linear-gradient(135deg, #5B5BD6, #8B5CF6, #EC4899);
                                border-radius: 18px; color: #FFFFFF; font-size: 2rem;
                                box-shadow: 0 12px 32px -10px rgba(91, 91, 214, 0.55);">
                        <i class="bi bi-shop"></i>
                    </div>
                </div>
                <h1 class="dash-hero__title" style="justify-content: center;">
                    yurit
                </h1>
                <p class="dash-hero__sub" style="justify-content: center;">
                    Hisobingizga kirib biznesni boshqaring.
                </p>

                <form method="post" style="text-align: left; margin-top: 1.25rem;">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">{{ form.username.label }}</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ form.password.label }}</label>
                        {{ form.password }}
                    </div>
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger py-2">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}
                    <button type="submit" class="dash-btn dash-btn--indigo btn-lg w-100" style="justify-content: center;">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span>Kirish</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
