{% extends 'inventory/base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <h3 class="mb-4">{{ title }}</h3>
            <div class="card p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">{{ form.name.label }}</label>
                        {{ form.name }}
                        {% if form.name.errors %}
                            <div class="text-danger small">{{ form.name.errors|join:', ' }}</div>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ form.address.label }}</label>
                        {{ form.address }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ form.phone.label }}</label>
                        {{ form.phone }}
                    </div>
                    <div class="form-check mb-3">
                        {{ form.is_active }}
                        <label class="form-check-label">{{ form.is_active.label }}</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Saqlash
                        </button>
                        <a href="{% url 'branch_list' %}" class="btn btn-outline-secondary">Bekor qilish</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
