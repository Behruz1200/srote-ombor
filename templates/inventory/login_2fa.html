{% extends 'inventory/base.html' %}
{% block title %}Tasdiqlash — yurit{% endblock %}
{% block backbar %}{% endblock %}
{% block content %}
<div class="container" style="max-width:420px; margin-top:8vh;">
  <div class="card p-4 shadow-sm text-center">
    <div class="mb-2"><i class="bi bi-shield-lock" style="font-size:2.4rem; color:#4338ca;"></i></div>
    <h5 class="mb-1">Ikki bosqichli tasdiqlash</h5>
    <p class="text-muted small mb-3">Autentifikator ilovasidagi 6 xonali kodni kiriting (yoki zaxira kod).</p>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
             maxlength="12" class="form-control form-control-lg text-center mb-3"
             placeholder="000000" autofocus style="letter-spacing:5px; font-size:1.5rem;">
      <button type="submit" class="btn btn-primary btn-lg w-100">Tasdiqlash</button>
    </form>
    <a href="{% url 'login' %}" class="d-block mt-3 small text-muted">Bekor qilish</a>
  </div>
</div>
{% endblock %}
